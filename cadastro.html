<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro - Nossa Vitrine</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;

            background: linear-gradient(
                135deg,
                #07852b,
                #0bb83d
            );

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
        }

        /* CAIXA */

        .cadastro-container {
            width: 100%;
            max-width: 450px;

            background: white;

            padding: 35px;

            border-radius: 20px;

            box-shadow:
                0 10px 35px rgba(0, 0, 0, 0.25);
        }

        /* LOGO */

        .logo {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo h1 {
            color: #07852b;
            font-size: 28px;
        }

        .logo p {
            color: #666;
            margin-top: 8px;
        }

        /* TÍTULO */

        .cadastro-container h2 {
            text-align: center;
            color: #222;

            margin-bottom: 25px;
        }

        /* CAMPOS */

        .campo {
            margin-bottom: 17px;
        }

        .campo label {
            display: block;

            margin-bottom: 7px;

            color: #333;

            font-weight: bold;
        }

        .campo input {
            width: 100%;

            padding: 14px;

            border: 1px solid #ccc;

            border-radius: 10px;

            font-size: 16px;

            outline: none;

            transition: 0.3s;
        }

        .campo input:focus {
            border-color: #07852b;

            box-shadow:
                0 0 0 3px rgba(7, 133, 43, 0.12);
        }

        /* BOTÃO */

        .botao-cadastro {
            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 10px;

            background: #07852b;

            color: white;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }

        .botao-cadastro:hover {
            background: #056b22;
        }

        /* MENSAGEM */

        #mensagem {
            text-align: center;

            margin-top: 15px;

            font-weight: bold;
        }

        /* LOGIN */

        .login {
            text-align: center;

            margin-top: 25px;

            color: #666;
        }

        .login a {
            color: #07852b;

            font-weight: bold;

            text-decoration: none;
        }

        /* VOLTAR */

        .voltar {
            text-align: center;

            margin-top: 20px;
        }

        .voltar a {
            color: #555;

            text-decoration: none;

            font-size: 14px;
        }

        /* CELULAR */

        @media (max-width: 500px) {

            .cadastro-container {
                padding: 25px 20px;
            }

            .logo h1 {
                font-size: 24px;
            }

        }

    </style>

</head>

<body>


    <div class="cadastro-container">


        <!-- LOGO -->

        <div class="logo">

            <h1>
                🛍️ Nossa Vitrine
            </h1>

            <p>
                Crie sua conta gratuitamente
            </p>

        </div>


        <!-- TÍTULO -->

        <h2>
            Criar minha conta
        </h2>


        <!-- FORMULÁRIO -->

        <form id="formCadastro">


            <!-- NOME -->

            <div class="campo">

                <label for="nome">
                    Nome completo
                </label>

                <input
                    type="text"
                    id="nome"
                    placeholder="Digite seu nome"
                    required
                >

            </div>


            <!-- E-MAIL -->

            <div class="campo">

                <label for="email">
                    E-mail
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Digite seu e-mail"
                    required
                >

            </div>


            <!-- SENHA -->

            <div class="campo">

                <label for="senha">
                    Senha
                </label>

                <input
                    type="password"
                    id="senha"
                    placeholder="Crie uma senha"
                    minlength="6"
                    required
                >

            </div>


            <!-- CONFIRMAR SENHA -->

            <div class="campo">

                <label for="confirmarSenha">
                    Confirmar senha
                </label>

                <input
                    type="password"
                    id="confirmarSenha"
                    placeholder="Digite a senha novamente"
                    minlength="6"
                    required
                >

            </div>


            <!-- BOTÃO -->

            <button
                type="submit"
                class="botao-cadastro"
            >
                📝 Criar minha conta
            </button>


            <!-- MENSAGEM -->

            <div id="mensagem"></div>


        </form>


        <!-- LOGIN -->

        <div class="login">

            Já possui uma conta?

            <a href="login.html">
                Entrar
            </a>

        </div>


        <!-- VOLTAR -->

        <div class="voltar">

            <a href="index.html">
                ← Voltar para a Nossa Vitrine
            </a>

        </div>


    </div>


    <!-- JAVASCRIPT -->

    <script>

        const formCadastro =
            document.getElementById("formCadastro");

        const mensagem =
            document.getElementById("mensagem");


        formCadastro.addEventListener(
            "submit",
            function(event) {

                event.preventDefault();


                const nome =
                    document.getElementById("nome").value.trim();

                const email =
                    document.getElementById("email").value.trim();

                const senha =
                    document.getElementById("senha").value;

                const confirmarSenha =
                    document.getElementById(
                        "confirmarSenha"
                    ).value;


                /* VERIFICAR SENHAS */

                if (senha !== confirmarSenha) {

                    mensagem.style.color =
                        "#d62828";

                    mensagem.textContent =
                        "As senhas não são iguais.";

                    return;
                }


                /* VERIFICAR TAMANHO */

                if (senha.length < 6) {

                    mensagem.style.color =
                        "#d62828";

                    mensagem.textContent =
                        "A senha precisa ter pelo menos 6 caracteres.";

                    return;
                }


                /* VERIFICAR SE JÁ EXISTE */

                const usuarioExistente =
                    localStorage.getItem(
                        "usuarioNossaVitrine"
                    );


                if (usuarioExistente) {

                    const usuario =
                        JSON.parse(usuarioExistente);


                    if (
                        usuario.email.toLowerCase() ===
                        email.toLowerCase()
                    ) {

                        mensagem.style.color =
                            "#d62828";

                        mensagem.textContent =
                            "Este e-mail já está cadastrado.";

                        return;
                    }

                }


                /* CRIAR USUÁRIO */

                const usuario = {

                    nome: nome,

                    email: email,

                    senha: senha,

                    notificacoes: false

                };


                /* SALVAR */

                localStorage.setItem(
                    "usuarioNossaVitrine",
                    JSON.stringify(usuario)
                );


                /* MENSAGEM */

                mensagem.style.color =
                    "#07852b";

                mensagem.textContent =
                    "Cadastro realizado com sucesso!";


                /* LIMPAR FORMULÁRIO */

                formCadastro.reset();


                /* IR PARA LOGIN */

                setTimeout(function() {

                    window.location.href =
                        "login.html";

                }, 1500);

            }
        );

    </script>


</body>

</html>
