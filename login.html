<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Nossa Vitrine</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;

            background: linear-gradient(
                135deg,
                #07852b,
                #0bb83d
            );

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
        }

        /* CAIXA DE LOGIN */

        .login-container {
            width: 100%;
            max-width: 420px;

            background: white;

            padding: 35px;

            border-radius: 20px;

            box-shadow:
                0 10px 35px rgba(0, 0, 0, 0.25);
        }

        /* LOGO */

        .logo {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo h1 {
            color: #07852b;
            font-size: 28px;
        }

        .logo p {
            color: #666;
            margin-top: 8px;
        }

        /* TÍTULO */

        .login-container h2 {
            text-align: center;
            color: #222;
            margin-bottom: 25px;
        }

        /* CAMPOS */

        .campo {
            margin-bottom: 18px;
        }

        .campo label {
            display: block;

            margin-bottom: 7px;

            color: #333;

            font-weight: bold;
        }

        .campo input {
            width: 100%;

            padding: 14px;

            border: 1px solid #ccc;

            border-radius: 10px;

            font-size: 16px;

            outline: none;

            transition: 0.3s;
        }

        .campo input:focus {
            border-color: #07852b;

            box-shadow:
                0 0 0 3px rgba(7, 133, 43, 0.12);
        }

        /* ESQUECEU SENHA */

        .esqueci {
            text-align: right;

            margin-top: -8px;

            margin-bottom: 20px;
        }

        .esqueci a {
            color: #07852b;

            text-decoration: none;

            font-size: 14px;
        }

        /* BOTÃO */

        .botao-login {
            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 10px;

            background: #07852b;

            color: white;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }

        .botao-login:hover {
            background: #056b22;
        }

        /* MENSAGEM */

        #mensagem {
            text-align: center;

            margin-top: 15px;

            font-weight: bold;
        }

        /* CADASTRO */

        .cadastro {
            text-align: center;

            margin-top: 25px;

            color: #666;
        }

        .cadastro a {
            color: #07852b;

            font-weight: bold;

            text-decoration: none;
        }

        /* VOLTAR */

        .voltar {
            text-align: center;

            margin-top: 20px;
        }

        .voltar a {
            color: #555;

            text-decoration: none;

            font-size: 14px;
        }

        /* CELULAR */

        @media (max-width: 500px) {

            .login-container {
                padding: 25px 20px;
            }

            .logo h1 {
                font-size: 24px;
            }

        }

    </style>

</head>

<body>


    <div class="login-container">


        <!-- LOGO -->

        <div class="logo">

            <h1>
                🛍️ Nossa Vitrine
            </h1>

            <p>
                Bem-vindo de volta!
            </p>

        </div>


        <!-- TÍTULO -->

        <h2>
            Entrar na sua conta
        </h2>


        <!-- FORMULÁRIO -->

        <form id="formLogin">


            <!-- E-MAIL -->

            <div class="campo">

                <label for="email">
                    E-mail
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Digite seu e-mail"
                    required
                >

            </div>


            <!-- SENHA -->

            <div class="campo">

                <label for="senha">
                    Senha
                </label>

                <input
                    type="password"
                    id="senha"
                    placeholder="Digite sua senha"
                    required
                >

            </div>


            <!-- ESQUECI SENHA -->

            <div class="esqueci">

                <a href="#">
                    Esqueci minha senha
                </a>

            </div>


            <!-- BOTÃO -->

            <button
                type="submit"
                class="botao-login"
            >
                Entrar
            </button>


            <!-- MENSAGEM -->

            <div id="mensagem"></div>


        </form>


        <!-- CADASTRO -->

        <div class="cadastro">

            Ainda não possui uma conta?

            <a href="cadastro.html">
                Cadastre-se
            </a>

        </div>


        <!-- VOLTAR -->

        <div class="voltar">

            <a href="index.html">
                ← Voltar para a Nossa Vitrine
            </a>

        </div>


    </div>


    <!-- JAVASCRIPT -->

    <script>

        const formLogin =
            document.getElementById("formLogin");

        const mensagem =
            document.getElementById("mensagem");


        formLogin.addEventListener(
            "submit",
            function(event) {

                event.preventDefault();


                const email =
                    document.getElementById("email").value;

                const senha =
                    document.getElementById("senha").value;


                /*
                 * Por enquanto estamos usando
                 * dados armazenados no navegador.
                 */

                const usuarioSalvo =
                    localStorage.getItem(
                        "usuarioNossaVitrine"
                    );


                if (!usuarioSalvo) {

                    mensagem.style.color =
                        "#d62828";

                    mensagem.textContent =
                        "Nenhum cadastro encontrado.";

                    return;
                }


                const usuario =
                    JSON.parse(usuarioSalvo);


                if (
                    email === usuario.email &&
                    senha === usuario.senha
                ) {

                    localStorage.setItem(
                        "usuarioLogado",
                        "true"
                    );


                    mensagem.style.color =
                        "#07852b";

                    mensagem.textContent =
                        "Login realizado com sucesso!";


                    setTimeout(function() {

                        window.location.href =
                            "index.html";

                    }, 1000);


                } else {

                    mensagem.style.color =
                        "#d62828";

                    mensagem.textContent =
                        "E-mail ou senha incorretos.";

                }

            }
        );

    </script>


</body>

</html>
